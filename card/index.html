<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    flex-direction: column;

  }

  .card {
    width: 100%;
    max-width: 390px;
    background: #141414;
    border-radius: 24px;
    border: 1px solid rgba(225,29,34,0.24);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(225,29,34,0.10), 0 32px 64px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
  }

  /* HEADER */
  .header {
    background: #E11D22;
    padding: 11px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-series {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 11px;
    line-height: 1.3;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #fff;
  }
  .header-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    flex-shrink: 0;
  }

  /* HERO */
  .hero {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    padding: 22px 24px 20px;
    border-bottom: 1px solid rgba(225,29,34,0.24);
  }
  .hero-photo {
    flex-shrink: 0;
    width: 92px;
    height: 112px;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid #E11D22;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .hero-text { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #E11D22;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(225,29,34,0.3);
  }
  .rider-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 40px;
    line-height: 0.92;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #fff;
  }
  .rider-name span { display: block; }
  .rider-role {
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #A8A8A8;
    margin-top: 9px;
  }
  .team-line {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #fff;
    margin-top: 3px;
  }

  /* SPEED STRIPE */
  .stripe {
    height: 3px;
    background: repeating-linear-gradient(90deg, #E11D22 0px, #E11D22 18px, transparent 18px, transparent 26px);
    opacity: 0.5;
  }

  /* CONTACT */
  .section { padding: 20px 24px; }
  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #A8A8A8;
    margin-bottom: 14px;
  }
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .action-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    padding: 16px 8px 13px;
    background: #1A1A1A;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.05);

  .action-label {

  .footer-season {

  .save-btn {
    pointer-events: auto;

    max-width: 390px;
    padding: 17px;
    background: #E11D22;
    color: #fff;

    align-items: center;
    justify-content: center;
    gap: 9px;
    cursor: pointer;
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn svg { width: 19px; height: 19px; fill: #fff; }
</style>
</head>

<script>
function saveContact() {
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Harrison Dessoy',
    'N:Dessoy;Harrison;;;',
    'TEL;TYPE=CELL:+447564226063',
    'EMAIL:harrison@dessoyracing.com',
    'URL:https://dessoyracing.com',
    'ORG:PHR Performance',
    'TITLE:Professional Motorcycle Racer',
    'NOTE:FIM World Sportbike Championship | #55 | Triumph Daytona 660',
    'END:VCARD'
  ].join('\r\n');
  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'harrison-dessoy.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
