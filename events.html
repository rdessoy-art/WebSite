        @media (max-width: 768px) {

            .page-hero h1 {

            .race-row {
                grid-template-columns: 1fr;

            .track-image {

                height: 120px;

            .race-country {

            .skip-link {

        <h1 class="events-title" id="events-title" style="text-align: center; border-left: none; margin: 2rem 0; font-size: 1.8rem;">Follow Harrison Dessoy at these events</h1>

    <script>
        renderNav('events', false);

        function showReportComingSoon(reportLabel) {
            var modal = document.getElementById('reportModal');
            var label = reportLabel || 'Report';
            // Generic wording that works for a race, a test day, or a
            // general event (a show, a sponsor visit) alike — the old
            // fixed text ("This race hasn't taken place yet...") read
            // wrong for anything that wasn't a race.
            modal.querySelector('h3').textContent = label + ' Coming Soon';
            modal.querySelector('p').textContent =
                "This isn't available yet — it will be published here shortly after the event.";
            modal.classList.add('active');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('reportModal').addEventListener('click', function(e) {
                if (e.target === this) closeReportModal();
            });
        });

        // ── Events page, driven entirely by data/events.json ──
        // That file is written by the external Publisher service — see
        // CLAUDE.md's "Anything rendered from data/*.json is untrusted"
        // invariant. Every value from it is passed through escapeHtml()
        // or safeUrl() before it touches the DOM.

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        // Allow only http(s) URLs; anything else falls back to '#'.
        function safeUrl(value) {
            try {
                const url = new URL(value);
                if (url.protocol === 'https:' || url.protocol === 'http:') {
                    return escapeHtml(url.href);
                }
            } catch (e) { /* not a valid absolute URL */ }
            return '#';
        }

        // A report path from Publisher is a repo-relative path
        // ("debriefs/foo.pdf"), not an absolute URL — safeUrl() would
        // reject it as "not a valid absolute URL". It still needs
        // escaping before going into an href attribute.
        function safeRelativePath(value) {
            const str = String(value ?? '');
            if (!str || str.startsWith('//') || str.includes('://') || str.startsWith('javascript:')) return '#';
            return escapeHtml(str);
        }

        function formatDateRange(startStr, endStr) {
            try {
                const start = new Date(startStr + 'T00:00:00');
                const end = endStr ? new Date(endStr + 'T00:00:00') : start;
                const opts = { month: 'long', day: 'numeric' };
                if (start.getMonth() === end.getMonth() && start.getDate() === end.getDate()) {
                    return start.toLocaleDateString('en-US', opts);
                }
                if (start.getMonth() === end.getMonth()) {
                    return start.toLocaleDateString('en-US', { month: 'long' }) + ' ' + start.getDate() + '-' + end.getDate();
                }
                return start.toLocaleDateString('en-US', opts) + ' - ' + end.toLocaleDateString('en-US', opts);
            } catch (e) {
                return escapeHtml(startStr || '');
            }
        }

        function isPastEvent(evt) {
            const endStr = evt.event_end_date || evt.event_start_date;
            if (!endStr) return false;
            const end = new Date(endStr + 'T23:59:59');
            return end < new Date();
        }

        function renderEventRow(evt) {
            const row = document.createElement('div');
            row.className = 'race-row';
            if (evt.event_info_url) row.dataset.eventUrl = safeUrl(evt.event_info_url);

            const flagImg = evt.country_code
                ? `<img loading="lazy" class="country-flag" src="https://flagcdn.com/w40/${escapeHtml(evt.country_code)}.png" alt="${escapeHtml(evt.country)}">`
                : '<span class="country-flag" aria-hidden="true"></span>';

            // report_label ('Race Report' / 'Test Report' / 'Report' for a
            // General debrief) is computed by Publisher, not re-derived
            // here — see data/events.json's documented contract.
            const reportLabel = evt.report_label || 'Report';
            const reportControl = evt.report_url
                ? `<a href="${safeRelativePath(evt.report_url)}" class="race-report-btn" target="_blank" rel="noopener">${escapeHtml(reportLabel)}</a>`
                : `<button type="button" onclick="showReportComingSoon('${escapeHtml(reportLabel)}')" class="race-report-btn">${escapeHtml(reportLabel)}</button>`;

            let ticketControl = '';
            if (evt.ticket_url) {
                if (isPastEvent(evt)) {
                    ticketControl = `<span class="race-report-btn btn-past" title="This event has already taken place">Buy Tickets</span>`;
                } else {
                    ticketControl = `<a href="${safeUrl(evt.ticket_url)}" class="race-report-btn" target="_blank" rel="noopener">Buy Tickets</a>`;
                }
            }

            row.innerHTML =
                flagImg +
                `<div class="country-name">${escapeHtml(evt.country)}</div>` +
                `<div class="race-date">${formatDateRange(evt.event_start_date, evt.event_end_date)}</div>` +
                `<div class="race-country"><span>${escapeHtml(evt.location)}</span></div>` +
                `<div class="track-name">${escapeHtml(evt.round_label)}</div>` +
                reportControl +
                ticketControl;

            row.addEventListener('click', function (e) {
                if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('a')) return;
                if (row.dataset.eventUrl) window.open(row.dataset.eventUrl, '_blank');
            });

            return row;
        }

        function renderSeason(data, seasonId) {
            const grid = document.getElementById('races-grid');
            const empty = document.getElementById('events-empty');
            grid.innerHTML = '';

            const events = (data.events || []).filter(function (e) { return e.season_id === seasonId; });
            if (!events.length) {
                empty.hidden = false;
                return;
            }
            empty.hidden = true;
            events.forEach(function (evt) { grid.appendChild(renderEventRow(evt)); });
        }

        async function loadEvents() {
            const grid = document.getElementById('races-grid');
            try {
                const response = await fetch('data/events.json');
                if (!response.ok) throw new Error('events.json not found');
                const data = await response.json();

                const seasons = data.seasons || [];
                const picker = document.getElementById('season-picker');
                const select = document.getElementById('season-select');
                const title = document.getElementById('events-title');

                if (!seasons.length) {
                    // No seasons configured yet — fall back to showing
                    // every event ungrouped, so the page is never just
                    // blank while the feature is being set up.
                    document.getElementById('events-empty').hidden = !!(data.events || []).length;
                    (data.events || []).forEach(function (evt) { grid.appendChild(renderEventRow(evt)); });
                    return;
                }

                select.innerHTML = seasons.map(function (s) {
                    return `<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)}</option>`;
                }).join('');
                picker.hidden = seasons.length < 2;

                const defaultSeasonId = data.current_season_id || seasons[0].id;
                select.value = defaultSeasonId;

                function updateTitle(seasonId) {
                    const season = seasons.find(function (s) { return s.id === seasonId; });
                    title.textContent = season
                        ? `Follow Harrison Dessoy at these events in ${season.label}`
                        : 'Follow Harrison Dessoy at these events';
                }

                updateTitle(defaultSeasonId);
                renderSeason(data, defaultSeasonId);

                select.addEventListener('change', function () {
                    updateTitle(select.value);
                    renderSeason(data, select.value);
                });
            } catch (e) {
                document.getElementById('events-empty').hidden = false;
                document.getElementById('events-empty').textContent = 'Events could not be loaded right now — please check back shortly.';
            }
        }

        loadEvents();
    </script>
